<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="robots" content="index, follow">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="author" content="{{ site.author }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link crossorigin="anonymous" href="{{ '/assets/css/main.css' | relative_url }}" rel="preload stylesheet" as="style">
<link rel="icon" href="{{ '/assets/favicon_wine.ico' | relative_url }}">
<meta name="theme-color" content="#2e2e33">
<meta name="msapplication-TileColor" content="#2e2e33">
<link rel="alternate" type="application/rss+xml" href="{{ '/feed.xml' | relative_url }}">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<noscript>
    <style>
        #theme-toggle,
        .top-link {
            display: none;
        }
    </style>
</noscript>
<style>
    :root {
        --theme: hsl(215, 20%, 99%);
        --entry: hsl(0, 0%, 100%);
        --primary: hsl(222, 47%, 12%);
        --secondary: hsl(215, 16%, 47%);
        --tertiary: hsl(214, 32%, 91%);
        --content: hsl(220, 20%, 20%);
        --border: hsl(214, 32%, 91%);
        --accent: hsl(250, 84%, 54%);
        --accent-hover: hsl(250, 84%, 48%);
        --hljs-bg: hsl(222, 47%, 11%);
        --code-bg: hsl(210, 20%, 96%);
    }

    body.dark {
        --theme: hsl(224, 25%, 12%);
        --entry: hsl(222, 24%, 15%);
        --primary: hsl(210, 40%, 98%);
        --secondary: hsl(215, 20%, 65%);
        --tertiary: hsl(222, 20%, 22%);
        --content: hsl(210, 25%, 88%);
        --border: hsl(222, 20%, 22%);
        --accent: hsl(250, 95%, 75%);
        --accent-hover: hsl(250, 95%, 80%);
        --hljs-bg: hsl(222, 24%, 15%);
        --code-bg: hsl(222, 20%, 18%);
    }

    @media (prefers-color-scheme: dark) {
        :root:not(.light) {
            --theme: hsl(224, 25%, 12%);
            --entry: hsl(222, 24%, 15%);
            --primary: hsl(210, 40%, 98%);
            --secondary: hsl(215, 20%, 65%);
            --tertiary: hsl(222, 20%, 22%);
            --content: hsl(210, 25%, 88%);
            --border: hsl(222, 20%, 22%);
            --accent: hsl(250, 95%, 75%);
            --accent-hover: hsl(250, 95%, 80%);
            --hljs-bg: hsl(222, 24%, 15%);
            --code-bg: hsl(222, 20%, 18%);
        }
    }

    .list {
        background: var(--code-bg);
    }

    body.dark .list {
        background: var(--theme);
    }
</style>
